[package]
name = "agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Provider-neutral agent runtime: state, sessions, events and execution"

[lib]
name = "gemini_acp_runtime"
path = "src/lib.rs"

[dependencies]
gemini_acp_config = { package = "llm-provider", path = "../llm-provider" }
gemini_acp_tools = { package = "tools-provider", path = "../tools-provider" }
agent-client-protocol = { workspace = true, features = ["unstable_elicitation"] }
regex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
