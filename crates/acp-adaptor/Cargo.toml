[package]
name = "acp-adaptor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ACP protocol adapter for the agent runtime"

[lib]
name = "gemini_acp_agent"
path = "src/lib.rs"

[[bin]]
name = "gemini-acp"
path = "src/bin/main.rs"

[[bin]]
name = "gemini-acp-snapshot"
path = "src/bin/snapshot.rs"

[dependencies]
agent-client-protocol = { workspace = true }
gemini_acp_encaps = { package = "agent-runtime", path = "../agent-runtime" }
gemini_acp_config = { package = "llm-provider", path = "../llm-provider" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }

[features]
default = ["unstable_session_fork"]
elicitation = ["agent-client-protocol/unstable_elicitation"]
unstable_session_fork = ["agent-client-protocol/unstable_session_fork"]
unstable_protocol_v2 = ["agent-client-protocol/unstable_protocol_v2"]
