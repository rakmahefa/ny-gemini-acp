[package]
name = "acp-adaptor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ACP adapter for Zed: transport, protocol handlers and presentation projection"

[[bin]]
name = "gemini-acp"
path = "src/bin/main.rs"

[[bin]]
name = "gemini-acp-snapshot"
path = "src/bin/snapshot.rs"

[dependencies]
gemini-acp-config = { package = "llm-provider", path = "../gemini-acp-config" }
gemini-acp-runtime = { package = "agent-runtime", path = "../gemini-acp-runtime" }
gemini-acp-encaps = { package = "acp-encapsulation", path = "../gemini-acp-encaps" }
agent-client-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }

[features]
default = ["unstable_session_fork"]
elicitation = ["agent-client-protocol/unstable_elicitation"]
unstable_session_fork = ["agent-client-protocol/unstable_session_fork"]
unstable_protocol_v2 = ["agent-client-protocol/unstable_protocol_v2"]
