name: Release Tests and Diagnostics

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional published release tag to download (for example v0.3.0); empty tests a fresh main build."
        required: false
        type: string

      run_live_integration:
        description: "Send one real prompt to Gemini (uses GEMINI_COOKIE)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-tests-${{ github.ref }}
  cancel-in-progress: true


jobs:
  diagnostics:

    name: Test Linux release and collect diagnostics

    runs-on: ubuntu-24.04

    timeout-minutes: 30


    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false


      - name: Enforce main-only source
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "Testing source from main."

          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then

            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
              exit 1
            fi

            git fetch --no-tags origin main

            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "::error::Only tags pointing to commits reachable from main can be tested."
              exit 1
            fi

            echo "Testing release tag $GITHUB_REF_NAME from main."

          else

            echo "::error::Run this workflow from main or a version tag based on main."
            exit 1

          fi


          mkdir -p \
            "$RUNNER_TEMP/diagnostics" \
            "$RUNNER_TEMP/release-assets"



      - name: Determine test target
        id: target

        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}

        run: |
          set -euo pipefail

          TAG="$INPUT_RELEASE_TAG"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF