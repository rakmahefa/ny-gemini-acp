name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Build and publish Linux x86-64 release
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce dev-only release source
        env:
          RELEASE_TAG: \${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::This workflow only publishes version tags."
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          git fetch origin dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/dev; then
            echo "::error::Release tags must point to a commit reachable from dev."
            exit 1
          fi
          echo "Validated release tag $RELEASE_TAG against branch dev."

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package release binaries
        id: package
        run: bash scripts/package-release.sh "$RUNNER_TEMP/release-assets" "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: \${{ github.token }}
          RELEASE_TAG: \${{ github.ref_name }}
          ASSET_DIR: \${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          ARCHIVE="$ASSET_DIR/ny-gemini-acp-$RELEASE_TAG-linux-x86_64.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"

          if [[ ! -s "$ARCHIVE" || ! -s "$CHECKSUM" ]]; then
            echo "::error::Release archive or checksum was not generated."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Ny Gemini ACP $RELEASE_TAG" \
            --generate-notes \
            "$ARCHIVE" \
            "$CHECKSUM"
