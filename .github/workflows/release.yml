name: Linux Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


jobs:

  build-release:

    name: Build Linux release

    runs-on: ubuntu-24.04

    timeout-minutes: 30


    steps:

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi


          git fetch --no-tags origin main


          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tag must point to a commit reachable from main."
            exit 1
          fi


          echo "Release tag validated: $GITHUB_REF_NAME"



      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable



      - name: Build release package

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/release-assets"

          bash scripts/package-release.sh \
            "$RUNNER_TEMP/release-assets" \
            "$GITHUB_REF_NAME"



      - name: Verify generated assets

        shell: bash

        run: |

          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/release-assets/ny-gemini-acp-$GITHUB_REF_NAME-linux-x86_64.tar.gz"

          CHECKSUM="$ARCHIVE.sha256"


          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Missing release archive."
            exit 1
          fi


          if [[ ! -s "$CHECKSUM" ]]; then
            echo "::error::Missing checksum."
            exit 1
          fi


          echo "Release assets verified."



      - name: Upload assets to existing GitHub Release

        env:

          GH_TOKEN: ${{ github.token }}

          RELEASE_TAG: ${{ github.ref_name }}


        shell: bash

        run: |

          set -euo pipefail


          ARCHIVE="$RUNNER_TEMP/release-assets/ny-gemini-acp-$RELEASE_TAG-linux-x86_64.tar.gz"

          CHECKSUM="$ARCHIVE.sha256"



          if ! gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "::error::GitHub Release $RELEASE_TAG does not exist."
            echo "Create the draft release first from GitHub website."
            exit 1

          fi



          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY"



          echo "Assets uploaded successfully."



      - name: Summary

        shell: bash

        run: |

          echo "Linux release completed."
          echo "Tag: $GITHUB_REF_NAME"