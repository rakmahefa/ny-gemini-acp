name: Validate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Codespace validation
    runs-on: [self-hosted, codespace]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository validation
        run: ./scripts/validate.sh
